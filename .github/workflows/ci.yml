name: CI

on:
  push:
  pull_request:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Solo compila: las suites necesitan el gateway en https://ecommerce.local
      - run: mvn -B test-compile
